name: epsa-observability
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: epsa_experiments
      POSTGRES_USER: epsa
      POSTGRES_PASSWORD: ${EPSA_POSTGRES_PASSWORD:?Set EPSA_POSTGRES_PASSWORD first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - experiments:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epsa -d epsa_experiments"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  experiments:

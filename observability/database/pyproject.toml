[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epsa-observability"
version = "0.1.0"
description = "PostgreSQL experiment storage for EPSA-RAG research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "epsa-rag-platform==0.1.0",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.16,<2",
]

[project.scripts]
epsa-experiments = "epsa_observability.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epsa_observability"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../src"]
addopts = ["--strict-config", "--strict-markers"]
markers = ["postgres: requires EPSA_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/epsa_observability"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/../../src"]
plugins = ["pydantic.mypy"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epsa-observability-api"
version = "0.1.0"
description = "Read-only FastAPI observability API for EPSA-RAG experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "epsa-observability==0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
epsa-observability-api = "epsa_observability_api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/epsa_observability_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../database/src", "../../src"]
addopts = ["--strict-config", "--strict-markers"]
markers = ["postgres: requires EPSA_TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["epsa_observability", "epsa_observability_api"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/epsa_observability_api"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/../database/src", "$MYPY_CONFIG_FILE_DIR/../../src"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "epsa-rag-platform"
version = "0.1.0"
description = "Research platform for the Evidence Path Sufficiency Algorithm."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.13,<2",
    "numpy>=2,<3",
    "openai>=2,<3",
    "pydantic>=2.12,<3",
]

[project.scripts]
epsa-prepare-hotpotqa = "epsa_rag.data.pipeline:main"
epsa-build-retrieval-indexes = "epsa_rag.retrieval.pipeline:main"
epsa-retrieve = "epsa_rag.retrieval.cli:main"
epsa-evaluate-retriever = "epsa_rag.evaluation.retrieval.cli:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epsa_rag"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=epsa_rag",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["epsa_rag"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["epsa_rag"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/epsa_rag"]
plugins = ["pydantic.mypy"]
